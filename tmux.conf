# Default Shell
#set -g default-shell "/bin/bash"
#set -g default-command "/bin/bash"

#set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on
set -g set-clipboard on
set -as terminal-features ',*:clipboard'
set -g @override_copy_command 'xclip -i -selection clipboard'
set -g @yank_selection 'clipboard'

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# set vi-mode
set-window-option -g mode-keys vi

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

###############################################
# ALL THEME CONFIGS
###############################################

# ---------- Basic Settings ----------
set -g status-position bottom
set -g status-style bg="#404040",fg=white
set -g status-interval 5

# ---------- Prefix Indicator ----------
# Always show ☺ with black text
# Background = #0087d7 normally, #00ffd7 when prefix active
set -g status-left-length 20
set -g status-left '#[fg=black]#{?client_prefix,#[bg=#00ffd7],#[bg=#0087d7]} 😈 '

# ---------- Right Side Info ----------
# username@hostname -> black text, cyan background (#00d7ff)
# time -> black text, blue background (#0087d7)
set -g status-right-length 50
set -g status-right '#[fg=black,bg=#00d7ff] #(whoami)@#H #[fg=black,bg=#0087d7] %H:%M '

# ---------- Window List ----------
# Inactive window: bg #153C6A, black font
set -g window-status-format '#[fg=black,bg=#153C6A] #I:#W '

# Active window: bg #00d7ff, black font
set -g window-status-current-format '#[fg=black,bg=#00d7ff,bold] #I:#W '

# No separator
set -g window-status-separator ''

# ---------- Pane Borders ----------
set -g pane-border-style fg="#5f00af"
set -g pane-active-border-style fg="#00d7ff"

# ---------- Messages ----------
set -g message-style bg="#153C6A",fg=white

# ---------- Copy/Mode Style ----------
set -g mode-style bg="#0087d7",fg=black


# Initialize TMUX plugin manager (KEEP THIS AT THE VERY BOTTOM)
run '~/.tmux/plugins/tpm/tpm'
